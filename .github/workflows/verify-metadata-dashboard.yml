name: Build metadados e dashboard
on:
  push:
    branches:
      - fix/metadata-dashboard-upstream-20260924
  pull_request:
    paths:
      - 'src/components/cadastro/**'
      - 'src/pages/Dashboard.tsx'
      - '.github/workflows/verify-metadata-dashboard.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
