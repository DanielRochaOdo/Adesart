name: Android Play Readiness

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-play-readiness.yml"
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-play-readiness.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate Play configuration
        run: |
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'DIRECT_UPDATE_ENABLED", "false"' app/build.gradle.kts
          if grep -q 'REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml; then
            echo "::error::REQUEST_INSTALL_PACKAGES must not be present in the standard/main manifest."
            exit 1
          fi

      - name: Compile and test Android flavors
        run: |
          chmod +x gradlew
          ./gradlew :app:testStandardDebugUnitTest :app:compileStandardDebugKotlin :app:compileDirectDebugKotlin :app:assembleStandardDebug --stacktrace --no-daemon

      - name: Verify standard manifest excludes APK installer permission
        run: |
          if grep -R -q 'android.permission.REQUEST_INSTALL_PACKAGES' app/build/intermediates/merged_manifests/standardDebug 2>/dev/null; then
            echo "::error::Standard flavor unexpectedly contains REQUEST_INSTALL_PACKAGES."
            exit 1
          fi

      - name: Verify 16 KB ZIP and ELF alignment
        run: |
          APK="app/build/outputs/apk/standard/debug/app-standard-debug.apk"
          test -f "$APK"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          rm -rf /tmp/vendamais-apk
          mkdir -p /tmp/vendamais-apk
          unzip -q "$APK" -d /tmp/vendamais-apk

          bad=0
          while IFS= read -r so; do
            while IFS= read -r align; do
              value=$((align))
              if (( value < 16384 )); then
                echo "::error file=$so::ELF LOAD alignment $align is below 16 KB"
                bad=1
              fi
            done < <(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }')
          done < <(find /tmp/vendamais-apk/lib -type f -name '*.so' 2>/dev/null || true)

          exit "$bad"
