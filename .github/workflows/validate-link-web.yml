name: Validate Link Web

on:
  pull_request:
    paths:
      - 'src/pages/PublicCadastroLink.tsx'
      - 'src/lib/publicLinkVisit.ts'
      - 'src/components/cadastro/LinksGeradosList.tsx'
      - 'supabase/migrations/20260921194500_dedupe_cadastro_link_visits.sql'
      - 'supabase/functions/cadastro-link-history/**'
      - 'tsconfig.link-web.json'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/cadastro-link-resolve/**'
      - 'supabase/functions/cadastro-public-contract-prepare/**'
      - 'supabase/functions/cadastro-public-submit/**'
      - 'supabase/functions/process-contract-deliveries/**'
      - '.github/workflows/validate-link-web.yml'
  workflow_dispatch:

jobs:
  typecheck-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.link-web.json
      - run: npm run build
  deno-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          deno check --node-modules-dir=auto \
            supabase/functions/cadastro-link-resolve/index.ts \
            supabase/functions/cadastro-link-history/index.ts \
            supabase/functions/cadastro-public-contract-prepare/index.ts \
            supabase/functions/cadastro-public-submit/index.ts \
            supabase/functions/process-contract-deliveries/index.ts
      - run: deno test --node-modules-dir=auto supabase/functions/_shared/plan-coverages.test.ts supabase/functions/_shared/contract-duration.test.ts supabase/functions/_shared/link-visits.test.ts
