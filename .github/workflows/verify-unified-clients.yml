name: Verificar Web e Android

on:
  pull_request:
    paths:
      - "src/**"
      - "supabase/**"
      - "android-app/**"
      - ".github/scripts/check_android_canonical.py"
      - ".github/workflows/verify-unified-clients.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "supabase/**"
      - "android-app/**"

jobs:
  canonical-architecture:
    name: Arquitetura canônica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar fonte única de regras
        run: python .github/scripts/check_android_canonical.py

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes unitários Android
        working-directory: android-app
        run: ./gradlew testStandardDebugUnitTest testDirectDebugUnitTest
      - name: Build Android debug
        working-directory: android-app
        run: ./gradlew assembleStandardDebug assembleDirectDebug
