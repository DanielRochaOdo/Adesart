name: Validate Link Pendencias Pagination

on:
  push:
    paths:
      - 'src/components/cadastro/LinkPendenciasList.tsx'
      - '.github/workflows/validate-link-pendencias-pagination.yml'
  pull_request:
    paths:
      - 'src/components/cadastro/LinkPendenciasList.tsx'
      - '.github/workflows/validate-link-pendencias-pagination.yml'

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
